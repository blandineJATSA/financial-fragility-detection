version: "3.8"

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__FERNET_KEY: ''
  GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp/service-account.json
  PYTHONPATH: /opt/airflow

x-airflow-common-volumes: &airflow-common-volumes
  - ../dags:/opt/airflow/dags
  - ../dbt_project:/opt/dbt_project
  - ../data_generation:/opt/airflow/data_generation
  - ../infra/gcp/service-account.json:/opt/airflow/gcp/service-account.json:ro
  - ../infra/dbt_profiles/profiles.yml:/home/airflow/.dbt/profiles.yml:ro

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    build:
      context: ..
      dockerfile: infra/dockerfiles/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    entrypoint: /bin/bash
    command:
      - "-c"
      - "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    build:
      context: ..
      dockerfile: infra/dockerfiles/Dockerfile.airflow
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8081:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: ..
      dockerfile: infra/dockerfiles/Dockerfile.airflow
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler

volumes:
  postgres-db-volume: